[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-claude-assistant"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "discord.py>=2.4",
    "python-dotenv>=1.0",
]

[project.scripts]
discord-claude-assistant = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]
